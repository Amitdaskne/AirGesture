name: Build Air Gesture
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      
      - name: Download MediaPipe Gesture Model
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/gesture_recognizer.task https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task
          
      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          ./gradle-8.2/bin/gradle assembleDebug
          
      - uses: actions/upload-artifact@v4
        with:
          name: AirGesture-APK
          path: app/build/outputs/apk/debug/app-debug.apk
